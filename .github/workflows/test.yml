name: Test

# Reusable: run a repository's shell test suite.
#
#   jobs:
#     test:
#       uses: lite-actions/lite-actions-workflows/.github/workflows/test.yml@v1
#
# Defaults match what the action repos already do, so a caller that passes
# nothing gets the behaviour it has today.
on:
  workflow_call:
    inputs:
      test-command:
        description: Command that runs the suite.
        type: string
        required: false
        default: "bash tests/test.sh"
      runs-on:
        description: Runner label.
        type: string
        required: false
        default: ubuntu-latest
      fetch-depth:
        description: >-
          Commits to fetch. The suite builds its own scratch repositories, so
          the default shallow checkout is enough.
        type: number
        required: false
        default: 1
      fetch-tags:
        description: >-
          Fetch tags as well. git-checkout does NOT imply tags at
          fetch-depth 0, unlike actions/checkout — set this explicitly if the
          suite resolves anything from tags.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        uses: lite-actions/git-checkout@v1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          fetch-tags: ${{ inputs.fetch-tags }}

      - name: Run script tests
        run: ${{ inputs.test-command }}
