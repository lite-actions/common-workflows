name: Changelog
description: >-
  Append the push's commits to CHANGELOG.md, regenerate RELEASE_NOTES.md, and
  land both via an auto-merged PR. Assumes the caller has checked out with
  fetch-depth 0 and fetch-tags true.
author: lite-actions

inputs:
  changelog-file:
    description: File to write the changelog to.
    required: false
    default: CHANGELOG.md
  release-notes-file:
    description: File to write the release notes to.
    required: false
    default: RELEASE_NOTES.md
  title:
    description: >-
      Heading written into the changelog file when it is first created. This is
      the CHANGELOG.md heading, not the release-notes one - see notes-title.
    required: false
    default: Changelog
  notes-title:
    description: >-
      Heading for the release-notes document. Empty uses release-notes' own
      default, which is the repository name from GITHUB_REPO. Set it where the
      repo slug is not the name you want readers to see.
    required: false
    default: ""
  bot-token:
    description: >-
      User PAT so the branch push and PR creation act as a real user and
      therefore trigger the required checks. GITHUB_TOKEN would not.
    required: false
    default: ""
  merge-method:
    description: >-
      How to merge the changelog PR: squash, rebase or merge. Must be a method
      the repository actually allows - a repo with squash merging disabled will
      fail the merge outright, not fall back.
    required: false
    default: squash
  approve-token:
    description: >-
      Second identity used to approve. A PR author or last pusher cannot
      self-approve, and GITHUB_TOKEN cannot approve at all.
    required: false
    default: ""

outputs:
  changed:
    description: "true if any commits were logged."
    value: ${{ steps.changelog.outputs.changed }}

runs:
  using: composite
  steps:
    # Guards the silent failure mode: release-notes resolves "since the last
    # release" from vX.Y.Z tags, and git-checkout appends --no-tags unless
    # fetch-tags is true, even at fetch-depth 0. Without this the notes version
    # from 0.0.0 and nothing looks wrong. Only errors when the remote HAS tags
    # and the checkout does not, so a repo before its first release is fine.
    - name: Verify tags were fetched
      shell: bash
      run: |
        set -euo pipefail
        local_tags="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n1 || true)"
        remote_tags="$(git ls-remote --tags origin 'v*.*.*' 2>/dev/null | head -n1 || true)"
        if [ -z "${local_tags}" ] && [ -n "${remote_tags}" ]; then
          echo "::error::The remote has vX.Y.Z tags but none were fetched. release-notes would version from 0.0.0. Check out with fetch-tags: true — git-checkout does not imply tags at fetch-depth 0."
          exit 1
        fi

    - name: Update changelog
      id: changelog
      uses: lite-actions/conventional-changelog@v1
      with:
        title: ${{ inputs.title }}
        output-file: ${{ inputs.changelog-file }}

    - name: Generate release notes
      if: steps.changelog.outputs.changed == 'true'
      uses: lite-actions/release-notes@v1
      with:
        title: ${{ inputs.notes-title }}
        output-file: ${{ inputs.release-notes-file }}

    # The shell guard that used to skip when tokens were unset is now a step
    # condition, because the work is split across three steps and one of them
    # is an action rather than a script.
    - name: Warn when the tokens are unset
      if: steps.changelog.outputs.changed == 'true' && (inputs.bot-token == '' || inputs.approve-token == '')
      shell: bash
      run: echo "::warning::bot-token / approve-token not set; skipping changelog PR."

    - name: Name the branch
      id: branch
      if: steps.changelog.outputs.changed == 'true' && inputs.bot-token != '' && inputs.approve-token != ''
      shell: bash
      run: echo "branch=chore/changelog-${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"

    # A runner has no signing key. Where the caller's branch requires signed
    # commits, an unsigned one blocks the pull request outright, so the commit
    # goes through GitHub's API instead.
    - name: Commit the changelog
      if: steps.changelog.outputs.changed == 'true' && inputs.bot-token != '' && inputs.approve-token != ''
      uses: lite-actions/signed-commit@v1
      with:
        branch: ${{ steps.branch.outputs.branch }}
        create-branch: true
        base-sha: ${{ github.sha }}
        message: "docs(changelog): update changelog and release notes"
        files: |
          ${{ inputs.changelog-file }}
          ${{ inputs.release-notes-file }}
        token: ${{ inputs.bot-token }}

    - name: Open, approve and auto-merge changelog PR
      if: steps.changelog.outputs.changed == 'true' && inputs.bot-token != '' && inputs.approve-token != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.bot-token }}
        APPROVE_TOKEN: ${{ inputs.approve-token }}
        BRANCH: ${{ steps.branch.outputs.branch }}
        MERGE_METHOD: ${{ inputs.merge-method }}
      run: |
        set -euo pipefail
        case "${MERGE_METHOD}" in
          squash|rebase|merge) ;;
          *)
            echo "::error::merge-method must be squash, rebase or merge, got '${MERGE_METHOD}'."
            exit 1
            ;;
        esac
        branch="${BRANCH}"
        gh pr create --base main --head "${branch}" \
          --title "docs(changelog): update changelog and release notes" \
          --body "Automated changelog + release-notes update from the latest merge to \`main\`."

        GH_TOKEN="${APPROVE_TOKEN}" gh pr review "${branch}" --approve \
          --body "Automated approval of changelog update."

        gh pr merge "${branch}" --auto "--${MERGE_METHOD}" --delete-branch

    - name: Clean up on failure
      if: failure() && steps.changelog.outputs.changed == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.bot-token }}
      run: |
        branch="chore/changelog-${GITHUB_RUN_ID}"
        gh pr close "${branch}" --delete-branch 2>/dev/null || true
        gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" 2>/dev/null || true
        echo "Cleaned up ${branch} (if it existed)."
